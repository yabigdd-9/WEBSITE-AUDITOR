schema_version: 1
taxonomy_version: "2026.09.21"
checks:
  - id: security.tls_expired
    name: Expired TLS certificate
    category: security
    severity: critical
    standards: [OWASP Transport Layer Security]
    auto_fixable: false
    evidence_required: [tls_certificate]
    default_priority: P0
    confidence: 0.99
    patterns: ["^Expired SSL"]

  - id: security.tls_expiring
    name: TLS certificate expiring soon
    category: security
    severity: high
    standards: [OWASP Transport Layer Security]
    evidence_required: [tls_certificate]
    default_priority: P1
    confidence: 0.99
    patterns: ["^SSL expiring"]

  - id: security.tls_verification_failed
    name: TLS certificate verification failed
    category: security
    severity: critical
    standards: [OWASP Transport Layer Security]
