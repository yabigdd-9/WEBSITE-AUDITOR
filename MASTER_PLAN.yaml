    phase_5:
      name: "Pipeline"
      status: "NOT_STARTED"
      actions:
        - "Integrate the Money Machine FSM into workflow triggers."
        - "Hard-disable the model router and approval engine in local mode."
      gate: "Automated integration test."
  scope_note: "The source marks phases 6-9 not done but does not define their scope."

historical_verified_baseline:
  as_of: "2026-09-22"
  source_status: "Reported in the supplied canonical execution plan; not re-verified in this edit."
  results:
    toolkit_suite: "145 passed, 2 skipped"
    money_machine_acceptance_suite: "56 passed, 2 intentional safety skips"
    real_chromium_browser_pdf_portal_test: "passed"
    real_monthly_browser_pdf_portal_test: "passed"
    doctor_research_only: "Database integrity OK; models intentionally disabled."
  branch_notes:
    - "The acceptance CLI/path repair was included."
    - "Duplicate-prospect validation tolerated malformed historical URLs without weakening validation of new intake URLs."

obsidian_operator_workspace:
  priority: HIGH
  recommended_root: "WEBSITE-AUDITOR-BRAIN"
  role:
    - "master brain"
    - "operator dashboard"
    - "project documentation"
    - "prospect/approval review"
    - "agent output viewer"
    - "experiment history"
    - "daily/weekly reporting"
    - "runbook/recovery reference"
  authority:
    canonical_runtime_state: false
    canonical_database: false
    canonical_queue: false
    canonical_send_authority: false
    canonical_pricing_authority: false
  runtime_relationship:
    supervisor: "launchd"
    operator_cli: "./mm"
    canonical_queue: "SQLite leased work queue"
    canonical_state: "SQLite + state files"
    agent_orchestrator: "Hermes"
    human_workspace: "Obsidian"
  vault_folders:
    - "00-DASHBOARD"
    - "01-MASTER-PLAN"
    - "02-LEADS"
    - "03-PROSPECTS"
    - "04-AGENTS"
    - "05-APPROVALS"
    - "06-EXPERIMENTS"
