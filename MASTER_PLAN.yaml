plan:
  name: "WEBSITE-AUDITOR Master Merged Plan"
  version: "32.0"
  status: "CANONICAL_EXECUTION_PLAN"
  primary_workspace: "/Users/dd/WEBSITE-AUDITOR"
  experimental_cline_workspace: "/Users/dd/Downloads/WEBSITE-AUDITOR-master"
  execution_mode: "local-first, zero-paid-token, evidence-first, supervised, obsidian-operator-workspace"
  paid_allowed: false
  max_cost_usd: 0
  outreach_default_enabled: false
  destructive_actions_default_allowed: false

non_negotiables:
  zero_cost:
    paid_allowed: false
    max_cost_usd: 0
    rules:
      - "Never silently fall back to a paid provider."
      - "When all free providers are unavailable, defer the job."
      - "Prefer deterministic Python over LLM calls."
  repository_safety:
    rules:
      - "Do not overwrite /Users/dd/WEBSITE-AUDITOR with the Downloads experimental copy."
      - "Do not merge experimental files directly into master."
      - "Use isolated branches/worktrees."
      - "Back up databases/state before migrations."
      - "Never allow concurrent coding agents to edit the same file."
  outreach_safety:
    transport_enabled: true
    send_enabled: false
    external_send_authorization: "Mandated human-gated review workflow only."
    human_approval_required_for:
      - "External sends through the mandated review workflow."
      - "Customer messages, pricing commitments and deployments."
    rules:
      - "No guessed email pattern is verified."
      - "Catch-all does not equal verified."
      - "NO_VERIFIED_EMAIL is acceptable."
      - "Respect suppression, duplicate prevention, cooldown, bounce and stop-on-response rules."
  production_change_policy:
    rules:
      - "No autonomous direct-to-master edits."
      - "Tests and quality gates are required before promotion."
      - "No measurable improvement means no self-improvement merge."
      - "Human review remains required for high-risk changes."

canonical_direction:
  repository: "/Users/dd/WEBSITE-AUDITOR"
  audit_engine: "auditor_toolkit + thin CLI layer"
  operator_cli: "./mm"
  operator_python_default: ".venv-email/bin/python"
  python_override_rule: "Set MM_PYTHON only to a verified Python 3.11+ environment."
  operator_entrypoint: "money-machine/mm_operator.py"
  runtime_state: "SQLite + state files"
  queue: "SQLite leased work queue"
  supervisor: "launchd + ./mm supervisor"
  supervisor_package: "money-machine/supervisor/"
  orchestrator: "Hermes"
  human_workspace: "Obsidian"
  obsidian_authoritative: false
  n8n_default_runtime: false
  optional_local_tools:
    discovery: "SearXNG"
    assistant: "LM Studio"
    deterministic_work_requires_model: false

phases:
  P0:
    name: "Repository reconciliation"
    priority: CRITICAL
    status: "PARTIAL_HISTORICAL_SECRET_REVIEW_OPEN"
    goal: "One trustworthy canonical codebase."
    gate:
      - "Canonical repo preserved."
      - "Experimental changes are selectively reviewed."
      - "No production data loss."
      - "Accepted/rejected imports traceable."
  P1:
    name: "Reproducible green baseline"
    priority: CRITICAL
    status: "TESTS_AND_DEPENDENCY_AUDIT_PASS_HISTORICAL_SECRET_AND_CLEAN_TREE_GATES_OPEN"
    python: "3.11"
    actions:
      - "Standardize dependency source."
      - "Run full tests and record baseline."
      - "Fix dependency/import failures."
      - "Remove tracked generated state."
      - "Maintain .env.example and hardened .gitignore."
      - "Run gitleaks and strict pip-audit."
    gate:
      - "Tests green or explicitly accepted."
      - "./mm doctor passes except optional integrations."
      - "Python 3.11 confirmed."
      - "No active secrets committed."
      - "Working tree clean."
    latest_verification:
      date: "2026-09-28"
      dependency_audit: "pip-audit 2.10.1 strict OSV audit of requirements.txt and money-machine/requirements-email.txt: no known vulnerabilities."
      full_toolkit_suite: "164 passed, 4 opt-in browser skips, 2 deprecation warnings."
      historical_secret_scan: "Gitleaks 8.30.1 scanned the current branch history: 103 matches across 4 historical commits, 0 at current HEAD. Redacted triage identified a shell-variable-backed CI curl auth argument, generated action/idempotency identifiers, captured third-party HTML, and scanner-rule documentation. A redacted scan of every current dirty/untracked path listed by git status found 0 matches; .env files were not scanned or opened. This does not cover the separate unreferenced local commit recorded under acceptance_open with 54 nonempty historical .env/.env.fcc assignments, and it does not establish third-party key ownership or rotation. Owner verification/rotation and the clean-tree gate remain open."
  P2:
    name: "Code consolidation"
    priority: HIGH
    goal: "One canonical audit engine and operator CLI."
    status: "COMPLETED"
    completed_at: "2026-09-26"
  P3:
    name: "Continuous control plane"
    priority: CRITICAL
    status: "IMPLEMENTED_TESTED_BUT_ACTIVE_RUNTIME_AND_QUEUE_RECOVERY_UNACCEPTED"
    queue: "SQLite leased work queue"
    required_cli:
      - "./mm supervisor start"
      - "./mm supervisor stop"
      - "./mm supervisor restart"
      - "./mm supervisor status"
      - "./mm supervisor health"
      - "./mm supervisor logs"
    features:
      - "single-instance protection"
      - "graceful shutdown"
      - "heartbeats"
      - "leases"
      - "stale-worker recovery"
      - "bounded retries/backoff/jitter"
      - "circuit breakers"
      - "dead-letter queue"
      - "log rotation/retention"
      - "disk/network guards"
      - "crash recovery"
    latest_verification:
      date: "2026-09-28"
      crash_restart_no_duplicate_work: "toolkit_tests/test_supervisor.py::test_supervisor_crash_recovery_no_duplicate_work passed (1 test, 7.45s) using isolated temporary MM_ROOT."
      soak: "User reports the 24-hour soak was completed in Claude; it was not rerun."
      live_read_only_snapshot: "2026-09-28: supervisor PID 51155 reports running; 30 queue rows are terminal REJECTED after QUALIFICATION_PENDING, with zero attempts; the qualification worker intentionally rejects insufficient commercial/technical scores. Active leases=0 and dead_lettered=0; network mode=degraded; paid calls=0 and external sends=0. No live state was changed."
      runtime_fix_rollout_gate: "Fresh process check: PID 51155 is a PID-1 child started 2026-09-28 02:34 NZDT and has database/money_machine.db open. Latest evidence-persistence/score-schema fix fe5132275d65b86d37ccab3f9f5ed7063e51dd82 was committed at 14:07 NZDT and is reachable only from codex/pipeline-evidence-integration, not the canonical runtime branch; the active process predates it. No merge, restart, or queue mutation was performed."
      historical_rejection_replay: "A read-only, in-memory deterministic replay found the latest AUDITED event for each of the 30 terminal rejected items has score=null. With the corrected handler, all 30 remain REJECTED with technical_score=0; their old events cannot supply a technical opportunity score. The replay made zero database writes, network requests, model calls, or external actions. Re-auditing would contact public sites and change queue work, so it remains an operator decision."
      reviewable_score_handoff: "Branch codex/pipeline-audit-evidence-handoff at 61cce2bf fixes the persisted worker AUDITED-event to qualification handoff, validates bounded scores/counts, keeps technical and commercial scores separate, and includes the ten-case golden corpus. It is integrated with the false-positive evidence gate on codex/review-integration at 0ca9ac74. The combined branch full toolkit suite passed 165 tests, 4 opt-in browser tests skipped, with 3 deprecation warnings; git diff --check passed. Review only: no canonical merge, live restart, or historical rejected work requeue."
  P4:
    name: "Audit engine"
    priority: HIGH
    status: "IMPLEMENTED_AND_REAL_OPTIONAL_CLI_CHAIN_VERIFIED_ON_LOCAL_FIXTURE"
    keep: ["Playwright", "axe-core", "BeautifulSoup", "trafilatura", "HTTP checks"]
    finish:
      - "Lighthouse/Core Web Vitals"
      - "Lychee broken-link validation"
      - "canonical domain resolution"
      - "security headers"
      - "robots/sitemap/schema"
      - "contact/booking/quote detection"
      - "responsive/HTML/TLS checks"
    fetch_chain: ["HTTP", "lightweight JS/browser", "Playwright"]
  P5:
    name: "Evidence-first findings"
    priority: CRITICAL
    status: "IMPLEMENTED_TESTED_FALSE_POSITIVE_REVIEW_EVIDENCE_GATED"
    rule: "Scores are derived from findings; material findings require evidence; false-positive classifications require an attributable reviewer, rationale, and complete run containing the finding."
    latest_verification:
      date: "2026-09-28"
      evidence_gate_branch: "codex/false-positive-review-gate at 3dc6fb6, based on upgrade/v32-canonical-execution. The remediation transition rejects missing reviewer, missing rationale, partial runs, and runs that do not contain the finding; a valid complete-run review records reviewer, rationale, and run ID. Full toolkit suite: 165 passed, 4 opt-in browser tests skipped, 2 upstream deprecation warnings. Ruff and diff checks passed. Branch is pushed for review and not merged."
  P6:
    name: "NZ business discovery"
    priority: HIGH
    status: "IMPLEMENTED_MULTI_SOURCE_DISCOVERY_TESTED"
    lanes: ["NZBN", "SearXNG", "industry directories", "public business directories", "public websites", "search engines", "permitted OSM-derived sources", "existing DB"]
    rule: "Deduplicate before expensive audit stages."
  P7:
    name: "Identity resolution"
    priority: HIGH
    status: "IMPLEMENTED_WEIGHTED_IDENTITY_TESTED"
    rule: "Use weighted evidence/confidence across NZBN, legal/trading name, domain, website, email domain and region."
  P8:
    name: "Email Finder V2"
    priority: CRITICAL
    status: "IMPLEMENTED_PROVENANCE_AND_GOLDEN_TESTED"
    states: ["VERIFIED", "STRONG_EVIDENCE", "CATCH_ALL", "UNVERIFIED", "NO_VERIFIED_EMAIL", "INVALID"]
    rule: "Every eligible email has provenance; pattern/MX/catch-all alone never equals verified."
  P9:
    name: "Opportunity scoring"
    priority: HIGH
    status: "IMPLEMENTED_SEPARATE_TECHNICAL_AND_COMMERCIAL_SCORES_TESTED"
    formula: "need * business_value * contactability * fixability * confidence / delivery_effort"
    rule: "Deterministic and replayable from stored inputs."
  P10:
    name: "Remediation engine"
    priority: HIGH
    status: "IMPLEMENTED_REVIEW_CLASSIFICATION_TESTED"
    classes: ["AUTO_SAFE", "AUTO_PREVIEW", "HUMAN_REVIEW", "CLIENT_ACCESS_REQUIRED", "UNSUPPORTED"]
    external_send_authorization: "Mandated human-gated review workflow only."
    human_required_for: ["customer messages", "pricing commitments", "deployments"]
  P11:
