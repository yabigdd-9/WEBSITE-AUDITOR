    catalyx_security_review_b1bf406e: "Completed Codex Security diff scan 870780cc-2cdc-459d-9c25-47f88682948a against exact range 9775a3d79cb992c4f85bc915515a90e2ba3593e4..b1bf406e113deee6239ef07e5ad44988ca3ffde3. It reviewed all four changed tracked files and reported two medium availability findings: pre-auth account-bucket lockout and purpose-global SMTP quota exhaustion. Coverage is complete for the selected diff; untracked experiments/, production proxy/IP behavior, SMTP configuration, and runtime systems were excluded or unverified. Report: /Users/dd/.codex/state/plugins/codex-security/scans/catalyx-auditor-rebuild/b1bf406e113deee6239ef07e5ad44988ca3ffde3_20260927T210148Z_6l475v9i/report.md. No .env was needed or read, and no soak test was run. Findings remain open; no implementation change or deployment was made from this scan."
    catalyx_current_standard_security_review: "Completed Codex Security Standard source scan 8639b614-d74d-4358-8aa5-b83efef9d487 on immutable b1bf406e113deee6239ef07e5ad44988ca3ffde3. It reviewed all 14 catalyx_web files and recorded five findings: two medium (distributed PBKDF2 capacity and account lockout) and three low (target-address recovery quota, rate-state cardinality, conditional registration timing). Coverage was partial because rate-state capacity impact was deferred; experiments/**, production/provider state, live services, customer data, and soak testing were excluded. A later bounded synthetic SQLite benchmark inserts 10,000 distinct rate subjects in 24.13s and yields a 2,428,928-byte database (about 243 bytes per row in this fixture); this narrows but does not close the capacity question or prove PostgreSQL/deployed growth. Report: /Users/dd/.codex/state/plugins/codex-security/scans/catalyx-auditor-rebuild/b1bf406e113deee6239ef07e5ad44988ca3ffde3_20260927T210448Z_tno1dbmw/report.md. These are open release gates."
    canonical_runtime_snapshot_20260928: "Fresh read-only checks at 2026-09-28 12:21 NZT: supervisor PID 51155 is alive as a PID-1 child, started 02:34 NZT, with a current heartbeat. The canonical source fix for sqlite3.Row access predates process start, but the audit-evidence persistence fix is now integrated with worker-runtime/DLQ fixes at 7c70c9f6 on codex/pipeline-evidence-integration and is not loaded by the active process. Queue has 30 REJECTED items, 0 active leases, 0 current DLQ items; cumulative metrics retain 16 earlier dead-letter events. A read-only SQL aggregation found all 30 rejection events had commercial=0 and technical=0; their current payloads have identity/discovery fields but no audit score or defect count. Network status remains degraded after DNS failure for example.com:443; disk guard is OK, paid calls and external sends are 0. No process, queue, database, launchd, or network-guard state was changed. Do not requeue or restart without operator control."
    canonical_runtime_snapshot_20260927T2134Z: "Fresh read-only snapshot on 2026-09-28 10:34 NZT: ./mm supervisor status reports PID 51155 running with a heartbeat at 21:34:33Z; ps confirms it is a child of PID 1 with cwd /Users/dd/WEBSITE-AUDITOR/money-machine, and lsof confirms it has /Users/dd/WEBSITE-AUDITOR/database/money_machine.db open. A read-only SQLite check reports integrity=ok, 30 pipeline_items all REJECTED, 0 active leases, 0 expired leases, 0 mm_jobs, and 290 pipeline_events. The dead-letter view reports 0 items but was generated at 12:27Z. state/health.json is also stale at 12:27Z and names former PID 22813, while state/network_guard.json was refreshed at 21:30Z and records a DNS failure for example.com:443. This conflicts with the stale health snapshot and does not prove healthy unattended operation or current DLQ visibility. No database, queue, process, launchd, network, or environment configuration was changed; no soak test was run. Do not restart or requeue without operator control."
    catalyx_phase6_terms_lighthouse: "Verified two local synthetic /terms mobile runs with Lighthouse 13.5.0 and pinned Chrome for Testing 153.0.8010.12. The first scored performance 94 with TBT 294 ms; the serial rerun scored 100 in performance/accessibility/best-practices/SEO with FCP/LCP 0.9 s, CLS 0, TBT 0 ms at 412x823 and simulated throttling. This confirms run-to-run lab variation but is too few runs to estimate a stable distribution. Reports: first SHA-256 3eaae80252c4a07fd501cf181b077241c11e83188ed7ea681168348e1da588c9 under task outputs; rerun SHA-256 12daacd1c2f76f3891c6d5bd470f5d7b39e7fc3e332fff49707bcf5cae2c243d under files-pasted-by-the-user-catalyxlabs outputs. Security review at pushed implementation commit 8f04403f recorded one medium and three low findings, including the global-login-budget availability trade-off. No soak test was run."
