      crash_restart_no_duplicate_work: "toolkit_tests/test_supervisor.py::test_supervisor_crash_recovery_no_duplicate_work passed (1 test, 7.45s) using isolated temporary MM_ROOT."
      soak: "User reports the 24-hour soak was completed in Claude; it was not rerun."
      live_read_only_snapshot: "Fresh read-only CLI checks at 2026-09-28 09:52 UTC: supervisor PID 14336 reports running with a current heartbeat; all eight registered workers report alive; queue has 30 terminal REJECTED items and zero active leases. ./mm dead-letter exposes a triage view and currently lists 0 items; cumulative metrics include 16 historical dead_lettered transitions. ./mm doctor reports SQLite integrity ok, models_enabled=false, model_calls=0. No runtime state was changed by these status/doctor/DLQ reads."
      runtime_fix_rollout_gate: "Active supervisor PID 14336 predates the pushed code on codex/review-integration, including audit evidence handoff, packet scoring and the P4 audit adapter evidence improvements. At f617b661, hosted toolkit tests (187 passed, 4 skipped), portable Money Machine tests (194 passed, 3 skipped, 53 subtests), browser fixtures (2 passed), SonarCloud, Gitleaks, pip-audit and Vercel pass; GitHub reports mergeable check state. PR #43 remains draft and has not been integrated into the active runtime. No merge, restart, or queue mutation was performed."
