    priority: MEDIUM
    status: "GOLDEN_AND_SYNTHETIC_COMPONENT_CHALLENGER_EVALUATED_RUNTIME_SHADOW_OPEN"
    flow: ["propose", "branch", "test", "evaluate", "shadow run", "compare metrics", "judge", "merge or reject"]
