    branch_from_sha: "0348b3f9"
  safety_gates:
    external_send_allowed: false
    max_cost_usd: 0
    redact_absolute_paths_before_report_generation: true
    import_shop_repository_code_config_or_assets: false
  source_status:
    not_done_phase_numbers: [1, 2, 3, 4, 5, 6, 7, 8, 9]
