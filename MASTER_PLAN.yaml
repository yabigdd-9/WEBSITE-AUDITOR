plan:
  name: "WEBSITE-AUDITOR Master Merged Plan"
  version: "32.0"
  status: "CANONICAL_EXECUTION_PLAN"
  primary_workspace: "/Users/dd/WEBSITE-AUDITOR"
  experimental_cline_workspace: "/Users/dd/Downloads/WEBSITE-AUDITOR-master"
  execution_mode: "local-first, zero-paid-token, evidence-first, supervised, obsidian-operator-workspace"
  paid_allowed: false
  max_cost_usd: 0
  outreach_default_enabled: false
  destructive_actions_default_allowed: false

non_negotiables:
  zero_cost:
    paid_allowed: false
    max_cost_usd: 0
    rules:
      - "Never silently fall back to a paid provider."
      - "When all free providers are unavailable, defer the job."
      - "Prefer deterministic Python over LLM calls."
  repository_safety:
    rules:
      - "Do not overwrite /Users/dd/WEBSITE-AUDITOR with the Downloads experimental copy."
      - "Do not merge experimental files directly into master."
      - "Use isolated branches/worktrees."
      - "Back up databases/state before migrations."
      - "Never allow concurrent coding agents to edit the same file."
  outreach_safety:
    transport_enabled: true
    send_enabled: false
    external_send_authorization: "Mandated human-gated review workflow only."
    human_approval_required_for:
      - "External sends through the mandated review workflow."
      - "Customer messages, pricing commitments and deployments."
    rules:
      - "No guessed email pattern is verified."
      - "Catch-all does not equal verified."
      - "NO_VERIFIED_EMAIL is acceptable."
      - "Respect suppression, duplicate prevention, cooldown, bounce and stop-on-response rules."
  production_change_policy:
    rules:
      - "No autonomous direct-to-master edits."
      - "Tests and quality gates are required before promotion."
      - "No measurable improvement means no self-improvement merge."
      - "Human review remains required for high-risk changes."

canonical_direction:
  repository: "/Users/dd/WEBSITE-AUDITOR"
  audit_engine: "auditor_toolkit + thin CLI layer"
  operator_cli: "./mm"
  operator_python_default: ".venv-email/bin/python"
  python_override_rule: "Set MM_PYTHON only to a verified Python 3.11+ environment."
  operator_entrypoint: "money-machine/mm_operator.py"
  runtime_state: "SQLite + state files"
  queue: "SQLite leased work queue"
  supervisor: "launchd + ./mm supervisor"
  supervisor_package: "money-machine/supervisor/"
  orchestrator: "Hermes"
  human_workspace: "Obsidian"
  obsidian_authoritative: false
  n8n_default_runtime: false
  optional_local_tools:
    discovery: "SearXNG"
    assistant: "LM Studio"
    deterministic_work_requires_model: false

phases:
  P0:
    name: "Repository reconciliation"
    priority: CRITICAL
    goal: "One trustworthy canonical codebase."
    gate:
      - "Canonical repo preserved."
      - "Experimental changes are selectively reviewed."
      - "No production data loss."
      - "Accepted/rejected imports traceable."
  P1:
    name: "Reproducible green baseline"
    priority: CRITICAL
    python: "3.11"
    actions:
      - "Standardize dependency source."
      - "Run full tests and record baseline."
      - "Fix dependency/import failures."
      - "Remove tracked generated state."
      - "Maintain .env.example and hardened .gitignore."
      - "Run gitleaks and strict pip-audit."
    gate:
      - "Tests green or explicitly accepted."
      - "./mm doctor passes except optional integrations."
      - "Python 3.11 confirmed."
      - "No active secrets committed."
      - "Working tree clean."
  P2:
    name: "Code consolidation"
    priority: HIGH
    goal: "One canonical audit engine and operator CLI."
    status: "COMPLETED"
    completed_at: "2026-09-26"
  P3:
    name: "Continuous control plane"
    priority: CRITICAL
    queue: "SQLite leased work queue"
    required_cli:
      - "./mm supervisor start"
      - "./mm supervisor stop"
      - "./mm supervisor restart"
      - "./mm supervisor status"
      - "./mm supervisor health"
      - "./mm supervisor logs"
    features:
      - "single-instance protection"
      - "graceful shutdown"
      - "heartbeats"
      - "leases"
      - "stale-worker recovery"
      - "bounded retries/backoff/jitter"
      - "circuit breakers"
      - "dead-letter queue"
      - "log rotation/retention"
      - "disk/network guards"
      - "crash recovery"
  P4:
    name: "Audit engine"
    priority: HIGH
    keep: ["Playwright", "axe-core", "BeautifulSoup", "trafilatura", "HTTP checks"]
    finish:
      - "Lighthouse/Core Web Vitals"
      - "Lychee broken-link validation"
      - "canonical domain resolution"
      - "security headers"
      - "robots/sitemap/schema"
      - "contact/booking/quote detection"
      - "responsive/HTML/TLS checks"
    fetch_chain: ["HTTP", "lightweight JS/browser", "Playwright"]
  P5:
    name: "Evidence-first findings"
    priority: CRITICAL
    rule: "Scores are derived from findings; material findings require evidence."
  P6:
    name: "NZ business discovery"
    priority: HIGH
    lanes: ["NZBN", "SearXNG", "industry directories", "public business directories", "public websites", "search engines", "permitted OSM-derived sources", "existing DB"]
    rule: "Deduplicate before expensive audit stages."
    implemented_slice:
      - "discover-batch combines bounded NZBN/curated CSV or JSON imports with loopback SearXNG queries."
      - "Candidates deduplicate by canonical host before intake and retain merged source provenance."
      - "Unavailable optional search lanes are reported without discarding successful source results."
    remaining:
      - "Add and validate further permitted NZ source adapters; this slice does not mark P6 complete."
  P7:
    name: "Identity resolution"
    priority: HIGH
    rule: "Use weighted evidence/confidence across NZBN, legal/trading name, domain, website, email domain and region."
  P8:
    name: "Email Finder V2"
    priority: CRITICAL
    states: ["VERIFIED", "STRONG_EVIDENCE", "CATCH_ALL", "UNVERIFIED", "NO_VERIFIED_EMAIL", "INVALID"]
    rule: "Every eligible email has provenance; pattern/MX/catch-all alone never equals verified."
  P9:
    name: "Opportunity scoring"
    priority: HIGH
    formula: "need * business_value * contactability * fixability * confidence / delivery_effort"
    rule: "Deterministic and replayable from stored inputs."
  P10:
    name: "Remediation engine"
    priority: HIGH
    classes: ["AUTO_SAFE", "AUTO_PREVIEW", "HUMAN_REVIEW", "CLIENT_ACCESS_REQUIRED", "UNSUPPORTED"]
    external_send_authorization: "Mandated human-gated review workflow only."
    human_required_for: ["customer messages", "pricing commitments", "deployments"]
  P11:
    name: "Demo factory"
    priority: HIGH
    flow: ["audit", "select", "create patch/reconstruction", "test", "render", "before screenshot", "after screenshot", "compare"]
  P12:
    name: "Quote engine"
    priority: HIGH
    rule: "Versioned deterministic pricing rules; LLM may explain but never determine price."
  P13:
    name: "Prospect packet"
    priority: HIGH
    gate: "No prospect reaches outreach without a complete reviewable packet."
  P14:
    name: "Outreach engine"
    priority: HIGH
    transport_enabled: true
    send_enabled: false
    external_send_authorization: "Mandated human-gated review workflow only."
    rule: "Agents cannot bypass transport policy."
  P15:
    name: "Free model router"
    priority: HIGH
    route: ["DETERMINISTIC_CODE", "LOCAL_FREE_MODEL", "FREE_EXTERNAL_ROUTE_1", "FREE_EXTERNAL_ROUTE_2", "DEFER"]
    max_cost_usd: 0
    max_large_local_models_concurrent: 0
    preferred_small_local_models_concurrent: 1
  P16:
    name: "Agent team"
    priority: HIGH
    orchestrator: "Hermes"
    roles: ["RESEARCHER", "CODER", "OPERATOR", "JUDGE", "PROOFER", "INTEGRATOR"]
    rule: "One branch/worktree per coding agent; no shared-file concurrent writes."
  P17:
    name: "Observability"
    priority: MEDIUM
    start_with: ["state/health.json", "state/metrics.jsonl", "state/errors.jsonl", "state/worker-heartbeats/", "state/dead-letter/"]
    defer: ["Prometheus", "Grafana", "Loki", "Langfuse"]
  P18:
    name: "Self improvement"
    priority: MEDIUM
    flow: ["propose", "branch", "test", "evaluate", "shadow run", "compare metrics", "judge", "merge or reject"]
    rule: "No direct autonomous modification of production."

catalyxlabs_rebuild:
  name: "Catalyx Labs website rebuild"
  site: "catalyxlabs.com"
  status: "PLANNED"
  source_document: "MASTER_EXECUTION_PLAN.md"
  execution_workspace:
