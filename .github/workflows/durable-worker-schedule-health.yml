name: Durable Worker Schedule Health

on:
  # Check Tue/Fri cron outcomes after a six-hour grace period, and repeat
  # on Wed/Sat to catch delayed or missed monitor runs themselves.
  # Schedule events are best-effort on GitHub; this job only reports drift.
  schedule:
    - cron: '15 11 * * 2,3,5,6'
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/durable-worker-schedule-health.yml'
      - 'scripts/check_durable_schedule_health.py'
      - 'toolkit_tests/test_durable_schedule_health.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/durable-worker-schedule-health.yml'
      - 'scripts/check_durable_schedule_health.py'
      - 'toolkit_tests/test_durable_schedule_health.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: durable-worker-schedule-health
  cancel-in-progress: false

jobs:
  verify-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test missed, skipped, and artifactless runs without network
        run: python -m unittest toolkit_tests.test_durable_schedule_health -v
      - name: Verify scheduled worker and encrypted checkpoint via GitHub metadata
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.check_durable_schedule_health
