name: Durable Cloud Draft Pipeline

on:
  schedule:
    - cron: '50 4 * * 2,5'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Create first checkpoint only (requires no previous runs)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/cloud_prospect_pipeline.py'
      - 'toolkit_tests/test_cloud_prospect_pipeline.py'
      - '.github/workflows/cloud-prospect-pipeline.yml'
      - 'config/cloud-prospects.json'

permissions:
  contents: read

concurrency:
  group: durable-cloud-draft-pipeline
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[vault]'
      - run: python -m unittest discover -s toolkit_tests -p 'test_cloud_prospect_pipeline.py' -v
  draft-pipeline:
    permissions:
      contents: read
      actions: read
    needs: tests
    # Owner configuration required; merging never activates prospect requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.WA_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WA_PIPELINE_STATE_KEY: ${{ secrets.WA_PIPELINE_STATE_KEY }}
      MM_PAID_ALLOWED: '0'
      MM_ALLOW_EXTERNAL_FREE_MODELS: '0'
      MM_EXTERNAL_SEND_ALLOWED: '0'
      BOOTSTRAP: ${{ inputs.bootstrap || false }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[vault]'
      - name: Restore immediately preceding checkpoint or fail closed
        shell: bash
        run: |
          set -euo pipefail
          STATE_FILE="$RUNNER_TEMP/pipeline-state.enc"
          test -n "$WA_PIPELINE_STATE_KEY"
          # Include failed/cancelled runs: never silently roll state backwards.
          previous=$(gh run list --workflow cloud-prospect-pipeline.yml --branch master --event schedule --limit 100 --json databaseId,createdAt)
          manual=$(gh run list --workflow cloud-prospect-pipeline.yml --branch master --event workflow_dispatch --limit 100 --json databaseId,createdAt)
          candidates=$(jq -nr --argjson a "$previous" --argjson b "$manual" --arg id "$GITHUB_RUN_ID" '$a + $b | map(select(.databaseId < ($id|tonumber))) | sort_by(.databaseId) | reverse | .[].databaseId')
          prior=''
          for candidate in $candidates; do
            job=$(gh api "repos/$GH_REPO/actions/runs/$candidate/jobs" --jq '.jobs[] | select(.name == "draft-pipeline") | .conclusion')
            if [ "$job" != 'skipped' ]; then
              prior=$candidate
              break
            fi
          done
          if [ -n "$prior" ]; then
            test "$BOOTSTRAP" != 'true'
            gh run download "$prior" --name pipeline-state --dir "$RUNNER_TEMP/restore"
            mv "$RUNNER_TEMP/restore/pipeline-state.enc" "$STATE_FILE"
          else
            test "$BOOTSTRAP" = 'true'
          fi
      - name: Audit eligible queue and checkpoint without sending
        shell: bash
        run: |
          STATE_FILE="$RUNNER_TEMP/pipeline-state.enc"
          args=()
          if [ "$BOOTSTRAP" = 'true' ]; then args+=(--bootstrap); fi
          python -m scripts.cloud_prospect_pipeline --state "$STATE_FILE" "${args[@]}"
      # A failed/cancelled prior run without a checkpoint blocks the next run.
      - name: Preserve encrypted checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pipeline-state
          path: ${{ runner.temp }}/pipeline-state.enc
          retention-days: 30
          if-no-files-found: error
