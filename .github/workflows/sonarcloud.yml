name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: 21
          distribution: temurin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[portal,dev]'
          python -m pip install pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest toolkit_tests tests \
            --cov-config=.coveragerc \
            --cov=auditor_toolkit \
            --cov=website_auditor \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Run SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Capture new-code reliability findings
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl --fail --silent --show-error \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=yabigdd-9_website-auditor&pullRequest=${PULL_REQUEST_NUMBER}&types=BUG&statuses=OPEN,CONFIRMED&ps=500" \
            | jq '{total, issues: [.issues[] | {key, rule, severity, message, component, line}]}' \
            > sonar-reliability-issues.json

      - name: Upload reliability findings for diagnosis
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sonar-reliability-issues
          path: sonar-reliability-issues.json
          if-no-files-found: warn
          retention-days: 1
