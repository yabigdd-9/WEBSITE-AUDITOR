name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: 21
          distribution: temurin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[portal,dev]'
          python -m pip install pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest toolkit_tests tests \
            --cov-config=.coveragerc \
            --cov=auditor_toolkit \
            --cov=website_auditor \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Run SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Report SonarCloud processing details
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -o pipefail
          task_file=.scannerwork/report-task.txt
          if [ ! -r "$task_file" ]; then
            echo "SonarCloud task metadata is unavailable."
            exit 0
          fi

          task_id="$(sed -n 's/^ceTaskId=//p' "$task_file" | head -n 1)"
          if [ -z "$task_id" ]; then
            echo "SonarCloud task ID is unavailable."
            exit 0
          fi

          curl --fail --silent --show-error \
            --header "Authorization: Basic $(printf '%s:' "$SONAR_TOKEN" | base64 --wrap=0)" \
            "https://sonarcloud.io/api/ce/task?id=${task_id}" \
            | jq '{task: (.task | {id, status, type, componentKey, analysisId, warningCount, errorMessage})}'
