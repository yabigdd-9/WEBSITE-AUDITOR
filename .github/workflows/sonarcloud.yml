name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, upgrade/v32-canonical-execution]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: 21
          distribution: temurin

      - name: Install locked binary dependencies
        run: |
          python -m pip install --only-binary=:all: uv==0.12.17
          uv sync --locked --no-build --no-install-project --extra portal --extra dev --extra email

      - name: Run tests with coverage
        run: |
          uv run --locked --no-sync --no-build python -m pytest toolkit_tests --cov-config=.coveragerc --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Run SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
