name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage

      - name: Reset coverage
        run: coverage erase

      - name: Tier-1 coverage tests
        run: coverage run --source=. -m pytest integrations/tier1_enrichment/tests -q

      - name: Bridge coverage tests
        run: coverage run --append --source=. -m pytest money-machine/test_mm_bridge.py -q

      - name: Supervisor coverage tests
        run: coverage run --append --source=. -m pytest money-machine/test_supervisor_daemon.py -q

      - name: Pipeline readiness coverage tests
        run: coverage run --append --source=. -m pytest money-machine/test_full_pipeline_readiness.py -q

      - name: Launchd coverage tests
        run: coverage run --append --source=. -m pytest money-machine/test_launchd.py -q

      - name: Discovery coverage tests
        run: coverage run --append --source=. -m pytest money-machine/test_discovery.py -q

      - name: Build coverage report
        run: |
          coverage xml -o coverage.xml
          coverage report -m
          test -s coverage.xml

      - name: Run SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
