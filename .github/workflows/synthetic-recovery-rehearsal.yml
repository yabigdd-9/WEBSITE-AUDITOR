name: Synthetic Postgres recovery rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/synthetic-recovery-rehearsal.yml'
      - 'requirements-hosted-ci.txt'
      - 'scripts/checkpoint_to_postgres.py'
      - 'scripts/cloud_prospect_pipeline.py'
      - 'scripts/cloud_storage_runner.py'
      - 'scripts/postgres_*.py'
      - 'supabase/migrations/**'
      - 'toolkit_tests/platform_helpers.py'
      - 'toolkit_tests/test_cloud_recovery_rehearsal.py'
      - 'toolkit_tests/test_postgres_store.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  MM_PAID_ALLOWED: '0'
  MM_ALLOW_EXTERNAL_FREE_MODELS: '0'
  MM_EXTERNAL_SEND_ALLOWED: '0'

jobs:
  crash-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-hosted-ci.txt
      - run: python -m scripts.install_reviewed_package
      - name: Crash the writer and export the synthetic encrypted pair
        env:
          WA_SYNTHETIC_RECOVERY_DIR: ${{ runner.temp }}/synthetic-recovery
        run: python -m pytest -q toolkit_tests/test_cloud_recovery_rehearsal.py::test_export_after_crash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-recovery-ciphertext
          path: |
            ${{ runner.temp }}/synthetic-recovery/pipeline-state.enc
            ${{ runner.temp }}/synthetic-recovery/pipeline-postgres-backup.enc
          if-no-files-found: error
          retention-days: 1

  restore-and-replay:
    needs: crash-and-export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-hosted-ci.txt
      - run: python -m scripts.install_reviewed_package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: synthetic-recovery-ciphertext
          path: ${{ runner.temp }}/synthetic-recovery
      - name: Restore into a fresh database and reject replay before HTTP
        env:
          WA_SYNTHETIC_RECOVERY_DIR: ${{ runner.temp }}/synthetic-recovery
        run: python -m pytest -q toolkit_tests/test_cloud_recovery_rehearsal.py::test_restore_on_fresh_runner
      - name: Verify controlled failure alert behavior with a mock issue API
        run: python -m unittest toolkit_tests.test_alert_durable_worker_failure -q
