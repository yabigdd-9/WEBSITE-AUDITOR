name: Cloud Canonical Website Audits

on:
  # Two bounded runs a day. Schedules can be delayed or skipped by GitHub.
  schedule:
    - cron: '20 2,14 * * *'
  workflow_dispatch:
  # Run once after this workflow is first merged, without needing secrets.
  push:
    branches: [master]
    paths:
      - '.github/workflows/cloud-scheduled-audits.yml'
      - 'scripts/cloud_scheduled_audits.py'
      - 'scripts/cloud_review_only_opportunities.py'
      - 'scripts/report_vault.py'
      - 'toolkit_tests/test_cloud_review_only_opportunities.py'
      - 'toolkit_tests/test_report_vault.py'
      - 'clients.txt'
      - 'auditor_toolkit/**'
      - 'pyproject.toml'

  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/cloud-scheduled-audits.yml'
      - 'scripts/cloud_review_only_opportunities.py'
      - 'scripts/report_vault.py'
      - 'toolkit_tests/test_cloud_review_only_opportunities.py'
      - 'toolkit_tests/test_report_vault.py'

permissions:
  contents: read

concurrency:
  group: cloud-canonical-audits
  cancel-in-progress: false

jobs:
  review-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[vault]'
      - name: Verify evidence, no-send drafts, encryption and ledger imports offline
        run: |
          python -m unittest toolkit_tests.test_cloud_review_only_opportunities toolkit_tests.test_report_vault toolkit_tests.test_review_ledger -v

  bounded-audits:
    needs: review-regression
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install canonical auditor (no optional paid or browser providers)
        run: python -m pip install -e '.[vault]'
      - name: Validate reviewed public-site allowlist
        run: python scripts/cloud_scheduled_audits.py --allowlist clients.txt --dry-run
      - name: Audit, qualify observed findings and generate approval-only scope drafts
        env:
          MM_ALLOW_EXTERNAL_FREE_MODELS: '0'
          MM_PAID_ALLOWED: '0'
          MM_EXTERNAL_SEND_ALLOWED: '0'
          MM_REPORT_PUBLIC_KEY_B64: ${{ vars.MM_REPORT_PUBLIC_KEY_B64 }}
          MM_ENCRYPTED_REPORT_OUT: ${{ runner.temp }}/mm-private-review.enc.json
        run: python -m scripts.cloud_review_only_opportunities --allowlist clients.txt --all
      - name: Retain encrypted reports and drafts for owner review (30 days)
        if: ${{ !cancelled() && vars.MM_REPORT_PUBLIC_KEY_B64 != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mm-sealed-review-${{ github.run_id }}
          path: ${{ runner.temp }}/mm-private-review.enc.json
          retention-days: 30
          if-no-files-found: error
      - name: Flag missing report storage configuration
        if: ${{ !cancelled() && vars.MM_REPORT_PUBLIC_KEY_B64 == '' }}
        run: |
          echo '::warning::Report storage is NOT configured. Add the owner public key as MM_REPORT_PUBLIC_KEY_B64. Detailed reports and drafts will be discarded; this run does not prove persistent storage.'
