name: Cloud Canonical Website Audits

on:
  # Two bounded runs a day. Schedules can be delayed or skipped by GitHub.
  schedule:
    - cron: '20 2,14 * * *'
  workflow_dispatch:
  # Run once after this workflow is first merged, without needing secrets.
  push:
    branches: [master]
    paths:
      - '.github/workflows/cloud-scheduled-audits.yml'
      - 'scripts/cloud_scheduled_audits.py'
      - 'clients.txt'
      - 'auditor_toolkit/**'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: cloud-canonical-audits
  cancel-in-progress: false

jobs:
  bounded-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install canonical auditor (no optional paid or browser providers)
        run: python -m pip install -e .
      - name: Validate reviewed public-site allowlist
        run: python scripts/cloud_scheduled_audits.py --allowlist clients.txt --dry-run
      - name: Run bounded canonical audits
        env:
          MM_ALLOW_EXTERNAL_FREE_MODELS: '0'
          MM_PAID_ALLOWED: '0'
          MM_EXTERNAL_SEND_ALLOWED: '0'
        run: python scripts/cloud_scheduled_audits.py --allowlist clients.txt
