name: MoneyMachine Private Ledger Offline Tests

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/moneymachine-private-ledger-tests.yml'
      - 'scripts/review_ledger.py'
      - 'toolkit_tests/test_review_ledger.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/moneymachine-private-ledger-tests.yml'
      - 'scripts/review_ledger.py'
      - 'toolkit_tests/test_review_ledger.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-offline-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MM_PAID_ALLOWED: '0'
      MM_EXTERNAL_SEND_ALLOWED: '0'
      MM_ALLOW_EXTERNAL_FREE_MODELS: '0'
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify private ledger deduplication and no-send safety (synthetic only)
        run: python -m unittest discover -s toolkit_tests -p 'test_review_ledger.py' -v
