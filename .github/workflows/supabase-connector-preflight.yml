name: Supabase Connector Read-Only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-connector-readonly
  cancel-in-progress: false

jobs:
  verify-private-connection:
    # Explicit manual dispatch on main only. Never execute PR source with DB credentials.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MM_PAID_ALLOWED: '0'
      MM_ALLOW_EXTERNAL_FREE_MODELS: '0'
      MM_EXTERNAL_SEND_ALLOWED: '0'
      WA_SUPABASE_PROJECT_REF: srymerkhraklwuttzexi
    steps:
      - name: Check out reviewed source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Local fail-closed preflight tests without database credentials
        run: python -m unittest discover -s toolkit_tests -p 'test_supabase_connection_preflight.py' -v

      - name: Install optional Postgres driver
        run: python -m pip install -e '.[postgres]'

      - name: Install the Supabase CA for connector verification
        uses: ./.github/actions/supabase-tls

      - name: Verify only the dedicated role and private checkpoint metadata
        env:
          WA_PG_DATABASE_URL: ${{ secrets.WA_PG_DATABASE_URL }}
        run: python -m scripts.supabase_connection_preflight
