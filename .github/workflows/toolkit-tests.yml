name: Local toolkit tests
on:
  pull_request:
    paths: ['auditor_toolkit/**', 'toolkit_tests/**', 'website_auditor/**', 'pyproject.toml', '.github/workflows/toolkit-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,browser,portal]'
      - run: python -m pytest toolkit_tests -q
      - run: ruff check auditor_toolkit toolkit_tests
      - run: python -m pip check
      - run: python -m pip wheel --no-deps . -w /tmp/wa-wheel
      - run: python -m playwright install --with-deps chromium
      - run: WA_BROWSER_E2E=1 python -m pytest toolkit_tests/test_browser_e2e.py -q
