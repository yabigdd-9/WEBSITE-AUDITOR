name: Local toolkit tests
on:
  pull_request:
    paths:
      - 'auditor_toolkit/**'
      - 'toolkit_tests/**'
      - 'website_auditor/**'
      - 'catalyx_web/**'
      - 'money-machine/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'money-machine/requirements-email.txt'
      - '.github/workflows/ci.yml'
      - '.github/workflows/toolkit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: "python -m pip install --only-binary=:all: uv==0.12.17"
      - run: uv sync --locked --no-build --no-install-project --extra dev --extra browser --extra portal --extra email
      - run: uv run --locked --no-build python -m pytest toolkit_tests -q --cov=auditor_toolkit --cov-report=xml
      - run: uv run --locked --no-build ruff check auditor_toolkit toolkit_tests
      - run: uv pip check --python .venv/bin/python
      - run: uv build --wheel --sdist --out-dir /tmp/wa-wheel
      - run: uv run --locked --no-build python -m playwright install --with-deps chromium
      - run: WA_BROWSER_E2E=1 uv run --locked --no-build python -m pytest toolkit_tests/test_browser_e2e.py toolkit_tests/test_monthly_browser_e2e.py -q
