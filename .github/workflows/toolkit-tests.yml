name: Local toolkit tests

on:
  pull_request:
    paths:
      - 'auditor_toolkit/**'
      - 'website_auditor/**'
      - 'toolkit_tests/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/toolkit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install core test dependencies
        run: python -m pip install -e '.[dev,portal]'

      - name: Run canonical + upgrade tests
        run: python -m pytest toolkit_tests tests -q

      - name: Lint canonical + upgrade suites
        run: ruff check auditor_toolkit toolkit_tests tests

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Verify wheel build
        run: python -m pip wheel --no-deps . -w /tmp/wa-wheel

      - name: Install browser test dependencies
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chromium

      - name: Run real-browser E2E coverage
        env:
          WA_BROWSER_E2E: '1'
        run: |
          python -m pytest \
            toolkit_tests/test_browser_e2e.py \
            toolkit_tests/test_monthly_browser_e2e.py \
            tests/e2e/test_proof_browser_capture.py \
            -q
