name: Nightly Website Watchdog

on:
  schedule:
    # Runs at 14:00 UTC every day (2:00 AM NZST / 3:00 AM NZDT)
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-website-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx beautifulsoup4 lxml

      - name: Run Nightly Watchdog
        run: python nightly_watchdog.py

      - name: Commit changed baseline snapshots
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/snapshots/

          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          git commit -m "chore: update nightly snapshots [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
