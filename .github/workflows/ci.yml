name: CI

on:
  push:
    branches: [master, trial/**]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
      - name: Run tier1 tests
        run: python -m unittest discover -s integrations/tier1_enrichment/tests -t . -v

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Smoke canonical CLI
        run: wa doctor --output-root /tmp/wa-smoke

  full-regression:
    name: Full Python regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install project + test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[portal,dev]'
          python -m pip install -r money-machine/requirements-email.txt
      - name: Compile canonical Python modules
        run: python -m compileall -q auditor_toolkit website_auditor money-machine
      - name: Run canonical + upgrade regression suites
        run: python -m pytest toolkit_tests tests -v
      - name: Run portable MoneyMachine regressions
        run: |
          python -m pytest \
            money-machine/test_discovery.py \
            money-machine/test_email_finder.py \
            money-machine/test_pipeline.py \
            money-machine/test_dsh_harness_bridge.py \
            money-machine/test_lead_qualifier.py \
            money-machine/test_polish.py \
            -v
      - name: Operator CLI import smoke
        run: python money-machine/mm_operator.py --help >/tmp/mm-help.txt
