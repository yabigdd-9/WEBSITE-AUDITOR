name: CI

on:
  push:
    branches: [master, trial/**, upgrade/**, integration/**]
  pull_request:
    branches: [master, integration/consolidated-2026-09-21]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
          uv pip install --system pytest pytest-asyncio
      - name: Compile evidence-first P0 surfaces
        run: |
          python -m py_compile website_auditor.py remediation-engine.py audit-dashboard.py audit/merge_audit.py run_all.py
          python -m compileall -q auditor_core website_auditor
      - name: Check rendered evidence JS syntax
        run: node --check audit/evidence-audit.mjs
      - name: Run auditor core tests
        run: python -m pytest auditor_core/test_core.py -q
      - name: Run network safety tests
        run: python -m pytest auditor_core/test_network.py -q
      - name: Run remediation verification tests
        run: python -m pytest auditor_core/test_verification.py auditor_core/test_quick_wins.py -q
      - name: Run action-engine tests
        run: python -m pytest website_auditor/test_actions.py -q
      - name: Smoke safe action CLI
        run: |
          python -m website_auditor.cli --output-dir /tmp/wa-actions actions init
          python -m website_auditor.cli --output-dir /tmp/wa-actions actions demo --domain example.co.nz
          python -m website_auditor.cli --output-dir /tmp/wa-actions actions dry-run
          python -m website_auditor.cli --output-dir /tmp/wa-actions actions status
      - name: Run tier1 tests
        run: python -m unittest discover -s integrations/tier1_enrichment/tests -t . -v
      - name: Run MoneyMachine readiness tests
        run: |
          python -m pytest \
            money-machine/test_mm_bridge.py \
            money-machine/test_supervisor_daemon.py \
            money-machine/test_launchd.py \
            money-machine/test_full_pipeline_readiness.py \
            money-machine/test_discovery.py \
            -q

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
      - name: Smoke audit
        run: python website_auditor.py https://example.com --format json -o /tmp/smoke.json
      - name: Full pipeline and supervisor readiness smoke
        run: |
          python -m py_compile full-pipeline.py money-machine/supervisor/daemon.py
          python - <<'PY'
          import importlib.util
          import os
          import tempfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("full_pipeline", "full-pipeline.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          with tempfile.TemporaryDirectory() as td:
              td = Path(td)
              mod.AUDITS = td / "audits"
              mod.AUDITS.mkdir()
              mod.CFG = {"quiet": True, "delay": 0, "output_dir": str(td), "max_workers": 1}
              results, errors = mod.run_email_discovery(max_workers=1, state=None)
              assert results == {}
              assert errors == {}

          spec2 = importlib.util.spec_from_file_location(
              "supervisor_daemon", "money-machine/supervisor/daemon.py"
          )
          daemon = importlib.util.module_from_spec(spec2)
          spec2.loader.exec_module(daemon)
          assert daemon._pid_is_alive(os.getpid())
          assert not daemon._pid_is_alive(-1)
          PY

      - name: n8n bridge and workflow smoke
        run: |
          python -m py_compile money-machine/mm_bridge.py
          bash -n automation/n8n/start-n8n.sh
          bash -n automation/n8n/stop-n8n.sh
          bash -n automation/n8n/healthcheck.sh
          bash -n automation/n8n/backup-n8n.sh
          bash -n automation/n8n/start-bridge.sh
          python - <<'PY'
          import json
          from pathlib import Path

          workflow_dir = Path("automation/n8n/workflows")
          files = sorted(workflow_dir.glob("*.json"))
          assert files, "no n8n workflows found"

          forbidden = {
              "send-via-approved-transport",
              "record-sent",
              "/send",
              "LIVE_SEND_ENABLED",
          }

          for path in files:
              data = json.loads(path.read_text())
              assert isinstance(data, dict)
              assert data.get("name")
              raw = path.read_text()
              for marker in forbidden:
                  assert marker not in raw, f"{path}: forbidden send marker {marker}"

          bridge = Path("money-machine/mm_bridge.py").read_text()
          assert '"send-via-approved-transport"' in bridge
          assert '"record-sent"' in bridge
          assert 'FORBIDDEN_ACTIONS' in bridge
          assert 'MM_EXTERNAL_SEND_DISABLED' in bridge
          PY
