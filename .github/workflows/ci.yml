name: CI

on:
  push:
    branches: [master, trial/**]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
      - name: Run tier1 tests
        run: python -m unittest discover -s integrations/tier1_enrichment/tests -t . -v

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
      - name: Smoke audit
        run: python website_auditor.py https://example.com --format json --output /tmp/smoke.json --no-tls


  full-regression:
    name: Full Python regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project + test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[portal,dev]'
          python -m pip install -r money-machine/requirements-email.txt
      - name: Run toolkit regression suite
        run: python -m pytest toolkit_tests -v
      - name: Run canonical discovery + email verification regressions
        run: |
          python -m pytest money-machine/test_discovery.py -v
          python -m pytest money-machine/test_email_finder.py -v
