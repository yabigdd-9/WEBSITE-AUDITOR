name: Verify hosted PostgreSQL recovery archive

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful cloud prospect pipeline run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  restore:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source workflow and result
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloud-prospect-pipeline.yml" --jq .id)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e --argjson workflow "$workflow_id" \
              '.workflow_id == $workflow and .conclusion == "success" and .head_branch == "master"' >/dev/null
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-hosted-ci.txt
      - run: python -m scripts.install_reviewed_package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: pipeline-state
          path: ${{ runner.temp }}/hosted-recovery
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: pipeline-postgres-backup
          path: ${{ runner.temp }}/hosted-recovery
      - name: Restore and compare state and operational records
        env:
          WA_HOSTED_RECOVERY_DIR: ${{ runner.temp }}/hosted-recovery
          WA_PIPELINE_STATE_KEY: ${{ secrets.WA_PIPELINE_STATE_KEY }}
        run: python -m pytest -q --tb=no --show-capture=no --durations=0 --durations-min=0 toolkit_tests/test_hosted_postgres_restore.py
