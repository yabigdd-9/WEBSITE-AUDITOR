name: Private Postgres persistence verification

on:
  workflow_dispatch:
    inputs:
      verify_persistence:
        description: 'Append synthetic pause events on two runners after the read-only preflight'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: durable-cloud-draft-pipeline
  cancel-in-progress: false

env:
  MM_PAID_ALLOWED: '0'
  MM_ALLOW_EXTERNAL_FREE_MODELS: '0'
  MM_EXTERNAL_SEND_ALLOWED: '0'

jobs:
  read-only-preflight:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure verified Supabase TLS
        uses: ./.github/actions/supabase-tls
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[postgres]'
      - name: Verify the restricted runtime role without changing state
        env:
          WA_POSTGRES_DSN: ${{ secrets.WA_POSTGRES_DSN }}
        run: python -m scripts.postgres_runtime_preflight
  first-runner:
    needs: read-only-preflight
    if: github.ref == 'refs/heads/master' && inputs.verify_persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      events: ${{ steps.verify.outputs.events }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure verified Supabase TLS
        uses: ./.github/actions/supabase-tls
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[postgres]'
      - id: verify
        name: Persist a pause event without auditing or sending
        env:
          WA_POSTGRES_DSN: ${{ secrets.WA_POSTGRES_DSN }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from scripts.cloud_prospect_pipeline import main
          from scripts.postgres_store import PostgresPipelineStore
          store = PostgresPipelineStore()
          before = store.operational_summary()['reservations']
          assert main(['--postgres', '--paused']) == 0
          assert store.operational_summary()['reservations'] == before
          events = len(store.read()['events'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'events={events}\n')
          print('First runner verified durable pause event; request reservations unchanged.')
          PY
  second-runner:
    needs: first-runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIOUS_EVENT_COUNT: ${{ needs.first-runner.outputs.events }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure verified Supabase TLS
        uses: ./.github/actions/supabase-tls
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[postgres]'
      - name: Verify persistence on a separate runner
        env:
          WA_POSTGRES_DSN: ${{ secrets.WA_POSTGRES_DSN }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from scripts.cloud_prospect_pipeline import main
          from scripts.postgres_store import PostgresPipelineStore
          store = PostgresPipelineStore()
          expected = int(os.environ['PREVIOUS_EVENT_COUNT'])
          assert len(store.read()['events']) >= expected
          before = store.operational_summary()['reservations']
          assert main(['--postgres', '--paused']) == 0
          assert len(store.read()['events']) >= expected + 1
          assert store.operational_summary()['reservations'] == before
          print('Independent runner verified persistence; no audit or send was executed.')
          PY
