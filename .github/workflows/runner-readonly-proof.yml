name: Runner read-only TLS proof
on:
  push:
    branches: [verify/runner-readonly-20261120]
    paths: [.github/workflows/runner-readonly-proof.yml]
permissions: {}
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Install the project dashboard's Supabase CA on this runner
        run: |
          curl --fail --silent --show-error --proto '=https' \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt \
            -o "$RUNNER_TEMP/supabase.crt"
          openssl x509 -in "$RUNNER_TEMP/supabase.crt" -noout -checkend 0
          sudo install -m 0644 "$RUNNER_TEMP/supabase.crt" /usr/local/share/ca-certificates/supabase.crt
          sudo update-ca-certificates
      - name: Install the PostgreSQL client library
        run: |
          python3 -m venv "$RUNNER_TEMP/db-client"
          "$RUNNER_TEMP/db-client/bin/pip" install --only-binary=:all: 'psycopg[binary]==3.2.13'
      - name: Verify identity and schema in a read-only transaction
        env:
          WA_POSTGRES_DSN: ${{ secrets.WA_POSTGRES_DSN }}
        run: |
          "$RUNNER_TEMP/db-client/bin/python" - <<'PY'
          import os
          import psycopg
          from urllib.parse import parse_qs, urlsplit

          dsn = os.environ.pop("WA_POSTGRES_DSN")
          url = urlsplit(dsn)
          assert url.hostname == "aws-1-ap-southeast-2.pooler.supabase.com"
          assert url.port == 5432 and url.path == "/postgres"
          assert url.username == "moneymachine_runner.srymerkhraklwuttzexi"
          assert parse_qs(url.query) == {"sslmode": ["verify-full"], "sslrootcert": ["system"]}
          try:
              with psycopg.connect(dsn, connect_timeout=10) as db:
                  db.execute("SET TRANSACTION READ ONLY")
                  db.execute("SET LOCAL ROLE moneymachine_worker")
                  row = db.execute("""SELECT session_user, current_user,
                      current_setting('transaction_read_only'), version
                      FROM moneymachine.schema_version WHERE singleton=1""").fetchone()
                  assert row == ("moneymachine_runner", "moneymachine_worker", "on", 1)
                  db.rollback()
          except psycopg.Error:
              raise SystemExit("Read-only database verification failed") from None
          print("Verified TLS, runner identity, read-only mode, and schema version 1.")
          PY
