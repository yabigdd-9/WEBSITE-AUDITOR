name: Dependency Review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
      - name: Dependency graph note
        if: failure()
        run: |
          echo "Dependency Review requires GitHub Dependency graph to be enabled."
          echo "OSV Scanner remains the active vulnerability gate until that repository setting is enabled."
