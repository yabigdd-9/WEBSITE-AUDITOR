name: Cloud Real-Evidence Opportunity Trial

on:
  # Run exactly once on merge or manually. No recurrence/soak testing.
  push:
    branches: [master]
    paths:
      - '.github/workflows/cloud-real-evidence-trial.yml'
      - 'scripts/cloud_real_opportunity_trial.py'
      - 'auditor_toolkit/**'
      - 'clients.txt'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/cloud-real-evidence-trial.yml'
      - 'scripts/cloud_real_opportunity_trial.py'
      - 'toolkit_tests/test_cloud_real_opportunity_trial.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-real-evidence-trial
  cancel-in-progress: false

env:
  MM_ALLOW_EXTERNAL_FREE_MODELS: '0'
  MM_PAID_ALLOWED: '0'
  MM_EXTERNAL_SEND_ALLOWED: '0'

jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install canonical auditor
        run: python -m pip install -e .
      - name: Verify evidence provenance, draft isolation and guards without network
        run: python -m unittest toolkit_tests.test_cloud_real_opportunity_trial -v

  real-evidence-review:
    # Never hit client websites on an unmerged pull request.
    if: github.event_name != 'pull_request'
    needs: synthetic-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install canonical auditor with no paid or browser providers
        run: python -m pip install -e .
      - name: Check allowlist and zero-spend zero-send guard
        run: python -m scripts.cloud_real_opportunity_trial --dry-run
      - name: Produce ephemeral evidence-backed review drafts (no outreach)
        run: python -m scripts.cloud_real_opportunity_trial

# No artifact uploads, database connections, CRM writes, messages or model APIs.
# Only aggregate counts and statuses go to the public GitHub Actions summary.
