name: Supabase Encrypted Checkpoint Store (offline tests)

on:
  pull_request:
    branches: [master]
    paths:
      - 'deploy/postgres/001_encrypted_checkpoints.sql'
      - 'scripts/supabase_checkpoint_store.py'
      - 'toolkit_tests/test_supabase_checkpoint_store.py'
      - 'pyproject.toml'
      - '.github/workflows/supabase-checkpoint-tests.yml'
  push:
    branches: [master]
    paths:
      - 'deploy/postgres/001_encrypted_checkpoints.sql'
      - 'scripts/supabase_checkpoint_store.py'
      - 'toolkit_tests/test_supabase_checkpoint_store.py'
      - 'pyproject.toml'
      - '.github/workflows/supabase-checkpoint-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-offline-checkpoint-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MM_PAID_ALLOWED: '0'
      MM_EXTERNAL_SEND_ALLOWED: '0'
      MM_ALLOW_EXTERNAL_FREE_MODELS: '0'
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install only bounded local test dependencies
        run: python -m pip install -e '.[vault,postgres]'
      - name: Validate encrypted checkpoint transactions without contacting Supabase
        run: python -m unittest discover -s toolkit_tests -p 'test_supabase_checkpoint_store.py' -v
