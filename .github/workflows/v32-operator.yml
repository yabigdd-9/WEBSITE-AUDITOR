name: v32 operator gate

on:
  push:
    branches:
      - execution/v32-obsidian-canonical
  pull_request:
    branches:
      - master

jobs:
  v32-operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tested Python extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[portal,dev]'
      - name: Compile operator modules
        run: |
          python -m compileall money-machine auditor_toolkit website_auditor
      - name: Obsidian non-authority tests
        run: |
          python -m pytest money-machine/test_obsidian.py -v
      - name: Agency and monthly regression
        run: |
          python -m pytest toolkit_tests/test_agency_revenue_monthly.py -v
      - name: Release regression
        run: |
          python -m pytest toolkit_tests/test_release.py -v
