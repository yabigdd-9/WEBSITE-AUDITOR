name: v32 operator gate

on:
  push:
    branches:
      - execution/v32-obsidian-canonical
  pull_request:
    branches:
      - master

jobs:
  v32-operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tested Python extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[browser,portal,dev]'
      - name: Compile operator modules
        run: |
          python -m compileall money-machine auditor_toolkit website_auditor
      - name: Obsidian and launchd safety tests
        run: |
          python -m pytest money-machine/test_obsidian.py money-machine/test_launchd.py -v
      - name: Agency and monthly regression
        run: |
          python -m pytest toolkit_tests/test_agency_revenue_monthly.py -v
      - name: Release regression
        run: |
          python -m pytest toolkit_tests/test_release.py -v
      - name: Full toolkit regression
        run: |
          python -m pytest toolkit_tests -q
      - name: Ruff
        run: |
          ruff check auditor_toolkit toolkit_tests
      - name: Dependency consistency
        run: |
          python -m pip check
      - name: Build wheel
        run: |
          python -m pip wheel --no-deps . -w /tmp/wa-wheel
      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium
      - name: Real Chromium E2E
        env:
          WA_BROWSER_E2E: "1"
        run: |
          python -m pytest             toolkit_tests/test_browser_e2e.py             toolkit_tests/test_monthly_browser_e2e.py             -q
