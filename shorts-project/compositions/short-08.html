<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Inter, ui-sans-serif, system-ui, sans-serif; padding: 60px; }
      .hook { color: #f4f4f5; font-size: 52px; font-weight: 700; letter-spacing: -0.02em; text-align: center; margin-bottom: 30px; line-height: 1.2; }
      .script { color: #a1a1aa; font-size: 36px; font-weight: 400; letter-spacing: -0.01em; text-align: center; line-height: 1.5; }
      .cta { color: #78716c; font-size: 28px; margin-top: 40px; text-align: center; }
      .progress { position: fixed; bottom: 0; left: 0; height: 6px; background: #22c55e; width: 0%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="short-08" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div class="progress" id="progress" data-start="0" data-duration="30"></div>
      <h1 class="hook clip" id="hook" data-start="0" data-duration="5">Your nutrients are right but your plants still look sick?</h1>
      <p class="script clip" id="script" data-start="3" data-duration="22">It's pH lockout. Nutrients lock out below pH 5.5 or above pH 6.5. Check pH daily in winter, weekly in summer. CATALYX works at 5.5-6.5 — wide range for NZ water.</p>
      <p class="cta clip" id="cta" data-start="26" data-duration="4">Follow for more</p>
    </div>
    <audio src="../audio/short-08.mp3" preload="auto"></audio>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hook", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5 }, 0);
      tl.fromTo("#script", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 3);
      tl.fromTo("#cta", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 26);
      tl.to("#progress", { width: "100%" }, 30);
      window.__timelines["short-08"] = tl;
      tl.seek(0);
    </script>
  </body>
