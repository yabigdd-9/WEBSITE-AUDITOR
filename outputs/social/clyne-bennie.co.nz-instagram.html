<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    width: 1080px; 
    height: 1080px; 
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, sans-serif;
    color: #fff;
    overflow: hidden;
}
.logo { 
    font-size: 2em; 
    font-weight: bold; 
    background: linear-gradient(135deg, #58a6ff, #a371f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5em;
}
.domain { font-size: 1.5em; color: #8b949e; margin-bottom: 1em; }
.score-circle {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: #00D4A322;
    border: 8px solid #00D4A3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4em;
    font-weight: bold;
    color: #00D4A3;
    margin: 0.5em 0;
}
.tier { 
    font-size: 1.5em; 
    font-weight: bold; 
    color: #00D4A3;
    padding: 8px 24px;
    border: 2px solid #00D4A3;
    border-radius: 30px;
}
.cta { margin-top: 1em; font-size: 1.2em; color: #58a6ff; }
</style>
</head>
<body>
    <div class="logo">CATALYX Labs</div>
    <div class="domain">clyne-bennie.co.nz</div>
    <div class="score-circle">85</div>
    <div class="tier">EXCELLENT</div>
    <div class="cta">Website Health Score</div>
</body>
</html>
