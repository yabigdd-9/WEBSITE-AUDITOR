    title: "Unimplemented analyzer stages not tracked as unimplemented"
    location: "auditor_toolkit/models.py:10-11,160-161"
    evidence: >
      UNIMPLEMENTED_STATIC_CHECKS and UNIMPLEMENTED_RENDERED_CHECKS are empty
      frozensets while CURRENT_STATE records seven analyzer bodies as
      unimplemented. STATIC_REQUIRED_CHECKS/RENDERED_REQUIRED_CHECKS list
      checks (third_party, browser_console, cookie_consent, axe, pdf,
      lighthouse) with no marker separating unimplemented from executed.
    root_cause: Unimplemented marker sets are empty; coverage reporting cannot
      distinguish "check passes" from "stage unimplemented."
    proposed_solution: >
      Populate UNIMPLEMENTED_* sets with the unimplemented analyzer stage IDs;
      gate current_coverage_gaps so an unimplemented required check is reported
      as a coverage gap with an explicit "unimplemented" reason.
    expected_benefit: Accurate coverage reporting; no unimplemented stage
      mistaken for a passing check; matches documented explicit skipped
      coverage contract.
    risk: Low — additive markers only.
    tests_required: >
      test_audit_coverage asserts unimplemented checks appear in
      current_coverage_gaps with reason; has_current_complete_coverage returns
      False when unimplemented required checks exist.
