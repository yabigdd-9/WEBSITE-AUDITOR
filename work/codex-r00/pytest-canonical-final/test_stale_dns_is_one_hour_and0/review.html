<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Draft send review</title><style>body{font:17px/1.5 system-ui;max-width:1050px;margin:30px auto;padding:20px}section{border:1px solid #aab;padding:20px;margin:20px 0}textarea{display:block;width:100%;min-height:240px}input{display:block;width:95%;margin-bottom:15px}button{padding:10px;margin:8px}:focus-visible{outline:3px solid #167}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Draft send review</h1><p>Evidence collection and local preparation run automatically. Your decision applies only to an exact draft. Nothing is sent here.</p>
<section><h2>Waiting for fresh evidence</h2><p>DRAFT_PACKAGE_ARTIFACT_CHANGED</p></section><section><h2>Automatically held</h2><p>Missing contact</p></section><script>const packets=[];const choices={};document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{const c=button.closest('section'),i=Number(c.dataset.index),p=packets[i],action=button.dataset.action,body=c.querySelector('textarea').value,basis=c.querySelector('input').value.trim();if(action==='approve'&&(body!==p.body||!basis||p.technical_holds.length)){c.querySelector('.status').textContent='Exact unchanged draft, permission basis and cleared preparation holds are required. Save edits separately.';return;}choices[i]={action,binding:p.decision_binding,edited_body:body,permission_basis:basis,approval_intent_only:true};c.querySelector('.status').textContent='Choice saved locally; nothing sent.';}));function download(){const blob=new Blob([JSON.stringify({version:'contact-draft-intents-v1',decisions:Object.values(choices),signed_approval_created:false,external_sends:0},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='draft-decisions.json';a.click();URL.revokeObjectURL(a.href);}</script><button onclick="download()">Download decisions</button></html>
