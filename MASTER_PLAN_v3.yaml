execution_order:
  # Parallel-safe groups for Codex and Opus worktrees
  # Group 1: Foundation (can be done in parallel across worktrees)
  - [F0]
  # Group 2: Control plane and quality (depends on F0; Codex can work on F1/Q0/Q1, Opus on A0/O0)
  - [F1, Q0, Q1, A0, O0]
  # Group 3: Discovery and auditing (depends on F0, A0; can parallelize D0/D1)
  - [D0, D1]
  # Group 4: Demo/quoting and outreach (depends on D1, Q0; can parallelize M0/C0)
  - [M0, C0]
  # Group 5: Financial, security, production reliability (depends on prior groups; can parallelize F2/S0/R0)
  - [F2, S0, R0]
  # Group 6: Deployment and verification (depends on R0)
  - [D2]
  # Milestones are checkpoints, not work packets

notes: |
  - Codex and Opus should work in separate Git worktrees linked to the same repo.
  - Each worktree can execute its assigned phases independently, respecting dependencies.
  - Phases within a group can be executed in parallel by the two agents, but must wait for the group to complete before moving to the next group.
  - All changes must be submitted as PRs and pass the automated gates (Q1) before merging.
  - The final promotion to production requires milestone M6 completion and human approval.