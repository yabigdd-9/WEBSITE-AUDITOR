# P6.2 — Short staging smoke test configuration
# Scope: bounded, staging-only, no production writes, no outreach, no paid tokens.

name: hermes-zero-token-smoke
version: "1.0"
duration_minutes: 15

staging:
  database_path: state/hermes_zero_token/staging/money_machine_staging.db
  snapshot_from: database/money_machine.db
  reset_before_run: true

workers:
  - id: staging_db
    enabled: true
    timeout_seconds: 60
  - id: screenshot_worker
    enabled: true
    timeout_seconds: 60
  - id: demo_blueprint
    enabled: true
    timeout_seconds: 60
  - id: outreach_draft
    enabled: true
    timeout_seconds: 60

safety:
  production_written: false
  external_send_allowed: false
  daily_cap: 0
  paid_models: false
  kill_switch: HERMES_ZERO_TOKEN_DISABLE_ALL

monitoring:
  heartbeat_interval_seconds: 30
  log_path: state/hermes_zero_token/audit.jsonl
  disk_free_mb_min: 1024
  worker_timeout_seconds: 60

stop_conditions:
  - production_written_true
  - staging_integrity_failed
  - kill_switch_activated
  - disk_free_below_1gb

rollback:
  stop_workers: true
  restore_production_db: false
  reset_staging_db: true
  clear_audit_log: false
