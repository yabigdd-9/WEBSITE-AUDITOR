architecture_diagram: |
  SCHEDULER (Windmill / supervisor --daemon)
    -> SQLite LEASED QUEUE (claim/retry/dead-letter)
    -> DISCOVER(NZBN + OSM-selfhost + SearXNG)
    -> IDENTITY(Splink + PSL + NZBN)
    -> CONTACT(crawl + trafilatura + schema.org + mailto provenance)
    -> VERIFY(consensus of 4, no port-25 reliance)
    -> AUDIT fan-out(toolkit, Unlighthouse, lychee, axe-core, testssl-passive, vision)
    -> SCORE(rubric + EV intervals) -> DRAFT(local AI for confidential)
    -> JUDGE -> PROOFER (fabrication = FAIL)
    -> HUMAN APPROVAL (per-message) -> SEND-or-never
    -> OUTCOME -> EVAL(promptfoo/GEPA) -> back into prompts
  DATA: SQLite+WAL(+vector) · run-ID artifacts · Gatus · GlitchTip(optional)
  AGENTS: Hermes/OpenCode via CLI-as-tool + scoped MCP; no mutation tools

backlog:
  P0: [dockerise, ollama+model-stack, provider-failover-routes, nzbn-backbone, discovery-compliance, splink, unlighthouse, axe-core, vision-critique, provider-health-router]
  P1: [email-consensus, disposable-list-refresh, lychee, testssl-passive, gatus, promptfoo, gepa, gotenberg, screenshot-diff, secrets-hardening, data-collection-deny, delete-symlinks]
  P2: [sqlite-vec-embeddings, windmill, nz-compliance-layer, dead-letter-triage-cli, migration-version-table]
  P3: [glitchtip, qdrant-eval, selfhost-nominatim, scorer-retraining]
