  - {step: 6, action: "Gotenberg + screenshot diff (odiff) for before/after", effort: "1-2 days"}
  - {step: 7, action: "Gatus + watchdogs + healthchecks", effort: "1 day"}
  - {step: 8, action: "Secrets hardening (Keychain, gitleaks CI)", effort: "0.5 day"}
  - {step: 9, action: "promptfoo eval harness + fixture regression tests", effort: "2 days"}
