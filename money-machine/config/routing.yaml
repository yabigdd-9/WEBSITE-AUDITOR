# Canonical explicit role routing. External routes are opt-in only.
execution_mode: manual_deterministic
model_execution_enabled: false
manual_role_requests_enabled: true
version: 3
catalog_source: https://openrouter.ai/api/v1/models
catalog_verified_date: "2026-09-21"
provider: openrouter

policy:
  paid_tokens: false
  prefer_free_models: true
  providers_sort: price
  require_parameters: true
  data_collection: deny
  external_free_requires_explicit_opt_in: true
  external_free_prompt_scope: public_or_non_confidential_only
  max_price: {prompt: 0, completion: 0, request: 0, image: 0}
  catalog_price_check_before_request: true
  free_suffix_required: true
  account_quota_exhausted: stop_and_log
  endpoint_failure: next_role_fallback_then_stop
  max_concurrent_children: 1
  max_retries_per_stage: 2
  max_stage_repeats: 2
  duplicate_task_guard: true
  recursive_delegation_guard: true
  proof_required_before_complete: true

roles:
  MASTER_ORCHESTRATOR:
    preferred: meituan/longcat-2.0:free
    fallbacks: [nvidia/nemotron-3-ultra-550b-a55b:free]
  DELEGATOR:
    preferred: meituan/longcat-2.0:free
    fallbacks: [nvidia/nemotron-3-ultra-550b-a55b:free]
  PLANNER:
    preferred: nvidia/nemotron-3-ultra-550b-a55b:free
    fallbacks: [meituan/longcat-2.0:free]
  JUDGE:
    preferred: nvidia/nemotron-3-ultra-550b-a55b:free
    fallbacks: [meituan/longcat-2.0:free]
  CRITIC:
    preferred: nvidia/nemotron-3-ultra-550b-a55b:free
    fallbacks: [meituan/longcat-2.0:free]
  RESEARCHER:
    preferred: thinkingmachines/inkling:free
    fallbacks: [nvidia/nemotron-3.5-lightning:free]
  FAST_RESEARCHER:
    preferred: nvidia/nemotron-3.5-lightning:free
    fallbacks: [inclusionai/ling-3.0-flash:free]
  CODER:
    preferred: poolside/laguna-s-2.1:free
    fallbacks: [poolside/laguna-xs-2.1:free]
  PRIMARY_CODER:
    preferred: poolside/laguna-s-2.1:free
    fallbacks: [poolside/laguna-xs-2.1:free]
  SECONDARY_CODER:
    preferred: poolside/laguna-xs-2.1:free
    fallbacks: [nvidia/nemotron-3.5-lightning:free]
  VISION:
    preferred: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    fallbacks: [inclusionai/ling-3.0-flash-vl:free]
  MULTIMODAL:
    preferred: inclusionai/ling-3.0-flash-vl:free
    fallbacks: [nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free]
  FINANCE_AGENT:
    preferred: inclusionai/ling-3.0-flash-fin:free
    fallbacks: [nvidia/nemotron-3-ultra-550b-a55b:free]
  BULK_WORKERS:
    preferred: nvidia/nemotron-3.5-lightning:free
    fallbacks: [poolside/laguna-xs-2.1:free]

rules:
  - Never silently switch to paid token usage.
  - External free routes are disabled unless explicitly enabled.
  - Public or synthetic prompts only; never send secrets, PII or confidential customer data to free endpoints.
  - Prefer another currently verified free model if the preferred model fails.
  - Stop and defer when free routes are unavailable or quota-limited.
  - Never allow recursive agent spawning.
  - Do not duplicate work unless comparison is deliberately required.
  - Role responses cannot approve leads, clear suppression, send outreach, modify pricing authority, or modify the CRM.
  - A judge using the creator model is not an independent review; require a human or distinct-model reviewer.
