# JSON Schema for routing.yaml configuration
$schema: http://json-schema.org/draft-07/schema#
title: Money Machine Model Routing Configuration
type: object
required:
  - PURPOSE_ROUTES
description: |
  Configuration for zero-cost model routing. Each role maps to an ordered
  list of (provider, model) tuples. Local providers are probed first,
  then :free external routes, then BlockedCost deferral.

properties:
  PURPOSE_ROUTES:
    type: object
    description: Mapping of role -> ordered candidate routes
    patternProperties:
      ^[a-z_]+$:
        type: array
        minItems: 1
        items:
          type: array
          minItems: 2
          maxItems: 2
          items:
            - type: string  # provider
            - type: ["string", "null"]  # model id (null for auto-probe)
          uniqueItems: true
    additionalProperties: false
  LLAMACPP_BASE:
    type: string
    format: uri
    default: "http://127.0.0.1:8080"
    description: llama.cpp server base URL
  OLLAMA_BASE:
    type: string
    format: uri
    default: "http://127.0.0.1:11434"
    description: Ollama server base URL
  LOCAL_MODEL_ENV:
    type: string
    default: "MM_LOCAL_MODEL"
    description: Environment variable for explicit local model ID
required:
  - PURPOSE_ROUTES
  - LLAMACPP_BASE
  - OLLAMA_BASE
  - LOCAL_MODEL_ENV
