# JSON Schema for Money Machine inference routing
$schema: http://json-schema.org/draft-07/schema#
title: Money Machine Zero-Cost Routing Configuration
type: object
description: |
  Active inference order is Claude through the loopback FCC harness first,
  Hermes verified-free role routing second, then BlockedCost/DEFER.
  llama.cpp and Ollama are intentionally not active Money Machine routes.

properties:
  FCC_BASE:
    type: string
    format: uri
    default: "http://127.0.0.1:8082"
    description: Loopback-only FCC/Claude harness gateway.
  FCC_MODEL_ENV:
    type: string
    default: "MM_FCC_MODEL"
    description: Environment variable selecting the exact Claude/FCC model.
  FCC_FREE_MODELS_ENV:
    type: string
    default: "MM_FCC_FREE_MODELS"
    description: Comma-separated exact FCC model IDs explicitly certified as zero-cost.
  HERMES_ROUTING_CONFIG:
    type: string
    default: "money-machine/config/routing.yaml"
    description: Hermes role routing policy; models must remain :free with zero price caps.
  paid_allowed:
    type: boolean
    const: false
  max_cost_usd:
    type: number
    const: 0

required:
  - FCC_BASE
  - FCC_MODEL_ENV
  - FCC_FREE_MODELS_ENV
  - HERMES_ROUTING_CONFIG
  - paid_allowed
  - max_cost_usd
additionalProperties: true
