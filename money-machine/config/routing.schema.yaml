# JSON Schema for money-machine/config/routing.yaml
$schema: http://json-schema.org/draft-07/schema#
title: Hermes Zero-Cost Role Routing Configuration
type: object
description: |
  This file governs the Hermes fallback lane. The Money Machine's active
  inference order is Claude via FCC first, then these Hermes :free roles,
  then DEFER. Paid fallback is forbidden.

required:
  - provider
  - manual_role_requests_enabled
  - policy
  - roles

properties:
  provider:
    const: openrouter
  manual_role_requests_enabled:
    const: true
  model_execution_enabled:
    type: boolean
  policy:
    type: object
    required:
      - paid_tokens
      - require_parameters
      - max_price
    properties:
      paid_tokens:
        const: false
      require_parameters:
        const: true
      data_collection:
        enum: [deny, allow]
      max_price:
        type: object
        required: [prompt, completion, request, image]
        properties:
          prompt: {const: 0}
          completion: {const: 0}
          request: {const: 0}
          image: {const: 0}
        additionalProperties: false
    additionalProperties: true
  roles:
    type: object
    minProperties: 1
    patternProperties:
      "^[A-Z_]+$":
        type: object
        required: [preferred]
        properties:
          preferred:
            type: string
            pattern: ":free$"
          fallbacks:
            type: array
            items:
              type: string
              pattern: ":free$"
            uniqueItems: true
        additionalProperties: false
    additionalProperties: false

additionalProperties: true
