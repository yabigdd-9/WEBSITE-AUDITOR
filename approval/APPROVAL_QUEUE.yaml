  id: APR-005
  type: legal_compliance_gate
  engine: ALL THREE
  priority: BLOCKS_ALL_OUTREACH
  description: NZ Unsolicited Electronic Messages Act 2007 consent basis for B2B cold
    email.
  verified_findings:
  - "UEMA covers email and applies to any message with a NZ link \u2014 verified on\
    \ dia.govt.nz."
  - "Penalty for non-compliance: fine up to NZ$500,000 \u2014 verified on dia.govt.nz."
  - There is NO blanket B2B exemption in NZ law (unlike US CAN-SPAM).
  - A business email published in a directory is NOT automatic consent.
  - Onus of proof of consent sits on the SENDER (s.9(3)).
  - Sender identification (s.10) and working unsubscribe (s.11) always apply.
  - Address-harvesting software / harvested lists are separately restricted (s.13).
  status: RESOLVED_BY_DION
  ask: 'Choose the consent basis before ANY cold email is sent. Options: (a) get NZ
    legal sign-off on an inferred-consent rationale; (b) switch to non-email first
    touch (phone/post/in-person, not covered by UEMA email rules); (c) run an opt-in
    route (content/lead magnet) and only email consenting businesses.'
  orchestrator_recommendation: Option (b) then (c). Dion already has a phone number
    for outreach (02904556680) and telemarketing is explicitly NOT covered by UEMA.
    Build the proof assets now, deliver the first touch by phone, and reserve email
    for businesses that respond or opt in. This removes the $500k exposure without
    slowing the pipeline.
  source_urls:
  - https://www.dia.govt.nz/Spam-NZ-Spam-Law-for-Businesses
  - https://www.legislation.govt.nz/act/public/2007/0007/latest/DLM405134.html
  decision: Proceed with email. No solicitor sign-off. Rely on INFERRED consent, per-prospect,
    human-ratified.
