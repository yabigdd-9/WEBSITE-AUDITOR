# Source Registry for WEBSITE-AUDITOR research
# Each entry represents a data source that can be used for enrichment or validation.
# Do not download massive datasets for this phase; only collect enough to validate schema.

sources:
  - source_id: nz_companies_office
    name: New Zealand Companies Office
    authority: New Zealand Government
    homepage: https://www.companiesoffice.govt.nz/
    documentation: https://www.companiesoffice.govt.nz/all-registers/api/
    access_method: REST API
    authentication_required: false
    cost: free
    license: Creative Commons Attribution 4.0 International (CC BY 4.0)
    commercial_use_status: allowed
    refresh_frequency: real-time
    data_format: JSON
    estimated_size: growing
    primary_keys: ["company_number"]
    useful_fields: ["company_number", "company_name", "registration_date", "status", "address"]
    rate_limits: unknown
    privacy_constraints: none
    attribution_requirements: Required
    production_recommendation: evaluate for NZ business identity
    last_verified: 2026-09-23

