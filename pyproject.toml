[project]
name = "website-auditor"
version = "4.1.0"
description = "Evidence-first website auditing for NZ businesses — free, local, zero-paid-inference"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

# Main dependencies (same as requirements.txt + requests added earlier)
dependencies = [
  "httpx>=0.28,<1",
  "aiohttp>=3.10",
  "beautifulsoup4>=4.15",
  "lxml>=6",
  "trafilatura>=2",
  "pyphen>=0.18.1,<0.19",
  "yarl>=1.25",
  "requests>=2.32",
  "pyyaml>=6",
  "tenacity>=9",
  "jinja2>=3.1",
  "certifi>=2025.8",
  "email-validator>=2.2,<3",
  "tldextract>=5.3.1,<6",
  "idna>=3.15,<4",
  "anyio>=4.15.1,<5",
  "pydantic>=2.9,<3",
]

[project.scripts]
wa = "website_auditor.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

# Build system
[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["website_auditor*", "auditor_core*"]

# Tool config
[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]

[tool.ruff.isort]
known-first-party = ["integrations", "money-machine"]

[tool.pytest.ini_options]
testpaths = [
  "website_auditor",
  "auditor_core",
  "integrations",
  "money-machine",
]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
