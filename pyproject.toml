[project]
name = "website-auditor"
version = "4.0.0"
description = "Evidence-first website auditing for NZ businesses — free, local, zero-paid-inference"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

# Main dependencies (same as requirements.txt + requests added earlier)
dependencies = [
  "httpx>=0.28,<1",
  "aiohttp>=3.10",
  "beautifulsoup4>=4.15",
  "lxml>=6",
  "trafilatura>=2",
  "yarl>=1.25",
  "requests>=2.32",
  "pyyaml>=6",
  "dnspython>=2.6,<3",
]

[project.scripts]
wa = "auditor_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["auditor_toolkit*", "website_auditor*"]
exclude = ["toolkit_tests*", "money-machine*", "deepseek-harness*"]

[tool.setuptools.package-data]
auditor_toolkit = ["assets/*.js", "assets/*.txt"]

[project.optional-dependencies]
browser = ["playwright>=1.51,<2"]
portal = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "argon2-cffi>=23,<26", "python-multipart>=0.0.18"]
ai = ["llama-cpp-python>=0.3,<1"]
smtp = ["aiosmtplib>=3,<4"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

# Build system
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Tool config
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "N"]
# Ruff formatter owns line wrapping; embedded HTML/JS and URLs may exceed the target width.

[tool.ruff.lint.isort]
known-first-party = ["integrations", "money-machine"]

[tool.pytest.ini_options]
testpaths = [
  "toolkit_tests",
]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "slow: marks tests that spawn background processes and take >10s (deselect with '-m \"not slow\"')",
]
