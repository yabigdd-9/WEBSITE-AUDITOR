# Source Registry
# Each entry follows the schema: source_id, publisher, authority, license, update_cadence, access_method, raw_format, normalization_version, freshness_rule, confidence_role

- source_id: nzbn
  publisher: "New Zealand Companies Office"
  authority: "statutory"
  license: "CC-BY-4.0"
  update_cadence: "daily"
  access_method: "API"
  raw_format: "JSON"
  normalization_version: "1.0"
  freshness_rule: "must be <= 7 days old"
  confidence_role: "identifier"

